<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>My Movie Library - The Big Bang Theory</title>
</head>
<body>
    <header>
       <div>
            <a href="../index.html" >
                <img src="../assets/images/mlib-icon.svg" alt="my library icon" height="32">
                <span>MLib</span>
            </a>
       </div>
       <nav>
        <a href="../pages/add-review.html">
        <button class="add-button" aria-label="Add new movie review">+</button>
        </a>
       </nav>
    </header>
    <main>
         <div class="details-box">
            <img src="../assets/images/BBT.png">
            <div class="review-box">
            <h2>The Big Bang Theory</h2>
            <div class="review-texting">
                <h3>Watched on:</h3>
                <span class="date-on">01/07/2026</span>
            </div>

            <div class="review-texting">
                <h3>Rating:</h3>
                <div class="rating">
                    <span>★</span>
                    <span>★</span>
                    <span>★</span>
                    <span>★</span>
                    <span class="star-empty">★</span>

            </div>

            <div class="review-texting">
                <h3>Review:</h3>
                <p class="review-text-new">Very good comedy actually 😊.</p>
            </div>
            </div>
         </div>
         
    </main>
    <footer>
    <p>&copy; 2025 MLib &ndash; My Movie Library</p>
